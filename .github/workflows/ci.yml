name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  docker-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create env file
        run: |
          cp .env.example .env
          {
            echo "OPENAI_API_KEY=dummy-ci-key"
            echo "AGENT_PLANNER_MODE=rules"
            echo "AGENT_MCP_CLIENT_ENABLED=false"
          } >> .env

      - name: Build and start Docker services
        run: docker compose -f compose.yaml -f compose.dev.yaml up -d --build

      - name: Run deterministic tests
        run: make ci-test

      - name: Run lightweight quality gate
        run: make ci-eval

      - name: Upload CI evaluation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-evaluation-reports
          path: outputs/ci/

      - name: Show service logs on failure
        if: failure()
        run: docker compose -f compose.yaml -f compose.dev.yaml logs --no-color --tail=200

      - name: Stop Docker services
        if: always()
        run: docker compose -f compose.yaml -f compose.dev.yaml down -v
